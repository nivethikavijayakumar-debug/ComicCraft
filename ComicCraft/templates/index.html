<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComicCraft | AI Comic Creator</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="home">
  <main class="container">
    <section class="hero">
      <div class="badge">✨ GEMINI + AI ART</div>
      <h1>Comic<span>Craft</span></h1>
      <p>Turn one idea into a complete illustrated comic story.</p>
    </section>

    <form class="card form-card" action="/generate" method="post">
      <label>Story Prompt
        <textarea name="story_prompt" required minlength="5" placeholder="A brave fox exploring an enchanted forest..."></textarea>
      </label>

      <div class="grid">
        <label>Main Character
          <input name="character_name" required placeholder="Arin the Fox">
        </label>
        <label>Setting
          <select name="setting">
            <option>Enchanted Forest</option>
            <option>School</option>
            <option>Future City</option>
            <option>Outer Space</option>
            <option>Village</option>
          </select>
        </label>
        <label>Story Tone
          <select name="tone">
            <option>Light-hearted</option>
            <option>Dramatic</option>
            <option>Poetic</option>
            <option>Funny</option>
            <option>Adventure</option>
          </select>
        </label>
        <label>Art Style
          <select name="art_style">
            <option>Comic book</option>
            <option>Anime</option>
            <option>Pixel art</option>
            <option>Fantasy illustration</option>
            <option>Realistic cinematic</option>
          </select>
        </label>
        <label>Panels
          <select name="panels">
            {% for n in range(3, 9) %}
            <option value="{{ n }}" {% if n == panels %}selected{% endif %}>{{ n }} panels</option>
            {% endfor %}
          </select>
        </label>
      </div>

      <button class="primary" type="submit">🚀 Create My Comic</button>
      <p class="hint">Tip: descriptive prompts produce richer scenes.</p>
    </form>
  </main>
</body>
</html>
